{% extends "base.html" %}
{% block title %}Oscar Trader AI — دخول المشرف{% endblock %}
{% block body %}
<main class="center-stage">
  <div class="card narrow">
    <div class="logo-big">OSCAR <b>ADMIN</b></div>
    <p class="tagline">هذه الصفحة للمشرف فقط</p>

    {% if admin_configured is defined and not admin_configured %}
    <div class="alert error">لم يتم ضبط ADMIN_PASSWORD في Render، لذلك الدخول معطّل.</div>
    {% endif %}

    <form action="/admin" method="POST">
      <label class="field" for="password">كلمة مرور المشرف</label>
      <input id="password" type="password" name="password" required autocomplete="current-password">
      <button class="btn primary block" type="submit" style="margin-top:18px">دخول</button>
    </form>
    <a href="/" class="link-quiet" style="margin-top:12px">العودة للموقع</a>
  </div>
</main>
{% endblock %}
